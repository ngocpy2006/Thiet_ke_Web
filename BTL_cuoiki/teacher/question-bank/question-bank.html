<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learnova - Ngân hàng câu hỏi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">

  <!-- Thứ tự quan trọng: sidebar -> topbar -> footer -->
  <link rel="stylesheet" href="../../style.css">

  <!-- CSS thành phần dùng chung -->
  <link rel="stylesheet" href="../../partial/sidebar/sidebar.css">
  <link rel="stylesheet" href="../../partial/topbar/topbar.css">
  <link rel="stylesheet" href="../../partial/footer/footer.css">

  <!-- CSS riêng trang Danh sách lớp -->
  <link rel="stylesheet" href="./question-bank.css">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div id="sidebar-slot"></div>

<!-- ============ VÙNG BÊN PHẢI SIDEBAR ============ -->
<div class="main">

  <!-- ================= TOPBAR ================= -->
  <div id="topbar-slot"></div>

  <!-- ============ NỘI DUNG TRANG ============ -->
  <main class="content">
    <div class="dash">

      <div class="tabs question-tabs" role="tablist" aria-label="Chức năng ngân hàng câu hỏi">
        <button type="button" role="tab" id="tabQ" aria-selected="true">Câu hỏi</button>
        <button type="button" role="tab" id="tabF" aria-selected="false">Quản lý bộ lọc</button>
      </div>

      <section id="paneQ" aria-label="Danh sách câu hỏi">
        <div class="dash">
          <div class="card question-controls">
          <div class="toolbar">
            <label class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Tìm theo từ khóa, mã hoặc nội dung câu hỏi..." aria-label="Tìm câu hỏi"></label>
            <div class="filters">
              <select id="fSort" aria-label="Sắp xếp">
                <option value="recent">Mới cập nhật</option>
                <option value="old">Cũ nhất</option>
                <option value="az">A-Z</option>
                <option value="level">Mức độ</option>
              </select>
            </div>
            <button type="button" class="btn ghost" id="btnClear">Xóa bộ lọc</button>
            <button type="button" class="btn" id="btnCreate" aria-haspopup="menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Tạo câu hỏi <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          </div>

          <div class="qfilters">
            <label class="fld">Chủ đề<span class="filters"><select id="fTopic"></select></span></label>
            <label class="fld">Nhãn<span class="filters"><select id="fTag"></select></span></label>
            <label class="fld">Dạng câu<span class="filters"><select id="fType"></select></span></label>
            <label class="fld">Mức độ<span class="filters"><select id="fDiff"></select></span></label>
            <label class="fld">Phạm vi<span class="filters"><select id="fVis">
              <option value="">Tất cả</option><option value="public">Công khai</option><option value="private">Riêng tư</option>
            </select></span></label>
          </div>

          <div class="subtabs" role="tablist" aria-label="Nhóm câu hỏi">
            <button type="button" role="tab" data-tab="all" aria-selected="true">Tất cả (<span id="cAll">0</span>)</button>
            <button type="button" role="tab" data-tab="mine" aria-selected="false">Của tôi (<span id="cMine">0</span>)</button>
            <button type="button" role="tab" data-tab="fav" aria-selected="false">Yêu thích (<span id="cFav">0</span>)</button>
          </div>

          </div>

          <div class="bulk" id="bulk" hidden></div>

          <div class="qb-layout">
            <section class="card" aria-label="Bảng câu hỏi">
              <div id="view"></div>
              <div class="foot">
                <span id="info"></span>
                <div class="pager" id="pager"></div>
                <label class="rows">Số dòng/trang
                  <span class="filters"><select id="fSize"><option value="8">8</option><option value="16">16</option><option value="32">32</option></select></span>
                </label>
              </div>
            </section>
            <aside class="card" id="preview" aria-label="Xem trước câu hỏi"></aside>
          </div>
        </div>
      </section>

      <section id="paneF" hidden aria-label="Quản lý bộ lọc">
        <div class="fgrid" id="fgrid"></div>
      </section>
    </div>

    <div class="menu" id="menu" role="menu" hidden></div>
    <dialog id="dlg"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <!-- ================= FOOTER ================= -->
  <div id="footer-slot"></div>

</div>

<script>
  window.PAGE = {"title": "Ngân hàng câu hỏi", "breadcrumb": ["Ngân hàng câu hỏi"]};
</script>
<script src="../../assets/data-loader.js"></script>
<script src="../connect.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="question-bank.js"></script>
</body>
</html>
