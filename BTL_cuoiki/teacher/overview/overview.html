<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learnova - Tổng quan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">

  <!-- Thứ tự quan trọng: sidebar -> topbar -> footer -->
  <link rel="stylesheet" href="../../style.css">

  <link rel="stylesheet" href="../../partial/sidebar/sidebar.css">
  <link rel="stylesheet" href="../../partial/topbar/topbar.css">
  <link rel="stylesheet" href="../../partial/footer/footer.css">
  
  <link rel="stylesheet" href="overview.css">
</head>
<body>

<div id="sidebar-slot"></div>


<div class="main">

  <div id="topbar-slot"></div>


  <!-- ============ NỘI DUNG TRANG ============ -->
  <main class="content">
    <div class="dash">
      <p class="greet" id="greet"></p>

      <!-- 4 thẻ số liệu (JS đổ dữ liệu) -->
      <section class="stats" id="stats" aria-label="Số liệu tổng quan"></section>

      <div class="row">
        <section class="card" aria-labelledby="t-chart">
          <header class="card-head">
            <h2 id="t-chart"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg><span>Tiến độ hoàn thành bài tập<small>Tỷ lệ học sinh nộp bài theo tuần</small></span></h2>
            <div class="filters">
              <select id="fPeriod" aria-label="Khoảng thời gian">
                <option value="4">4 tuần gần đây</option>
                <option value="8">8 tuần gần đây</option>
              </select>
            </div>
          </header>
          <div id="chart" role="img"></div>
        </section>

        <section class="card" aria-labelledby="t-todo">
          <header class="card-head">
            <h2 id="t-todo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>Việc cần xử lý</h2>
            <a class="see-all" href="#">Xem tất cả <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
          </header>
          <ul class="todo" id="todo"></ul>
        </section>
      </div>

      <div class="row">
        <section class="card" aria-labelledby="t-recent">
          <header class="card-head">
            <h2 id="t-recent"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>Bài tập &amp; kiểm tra gần đây</h2>
            <a class="see-all" href="#">Xem tất cả <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
          </header>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Tên bài</th><th>Lớp</th><th>Ngày giao</th><th>Hạn nộp</th><th>Tỷ lệ nộp</th><th></th></tr></thead>
              <tbody id="recent"></tbody>
            </table>
          </div>
        </section>

        <section class="card" aria-labelledby="t-acts">
          <header class="card-head">
            <h2 id="t-acts"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Hoạt động học sinh gần đây</h2>
            <a class="see-all" href="#">Xem tất cả <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
          </header>
          <ul class="acts" id="acts"></ul>
        </section>
      </div>
    </div>
  </main>

  <div id="footer-slot"></div>

</div>

<script>
  window.PAGE = {"title": "Tổng quan", "breadcrumb": ["Tổng quan"]};
</script>
<script src="../../assets/data-loader.js"></script>
<script src="../connect.js"></script>
<script src="overview.js"></script>
</body>
</html>
