<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learnova - Danh sách lớp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">

<!-- CSS tổng toàn hệ thống -->
  <link rel="stylesheet" href="../../style.css">

  <!-- CSS thành phần dùng chung -->
  <link rel="stylesheet" href="../../partial/sidebar/sidebar.css">
  <link rel="stylesheet" href="../../partial/topbar/topbar.css">
  <link rel="stylesheet" href="../../partial/footer/footer.css">

  <!-- CSS riêng trang Danh sách lớp -->
  <link rel="stylesheet" href="./classes.css">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div id="sidebar-slot"></div>

<!-- ============ VÙNG BÊN PHẢI SIDEBAR ============ -->
<div class="main">

  <!-- ================= TOPBAR ================= -->
  <div id="topbar-slot"></div>

  <!-- ============ NỘI DUNG TRANG ============ -->
  <main class="content">
    <div class="dash">

      <div class="toolbar class-controls card">
        <label class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Tìm kiếm theo tên lớp, mã lớp..." aria-label="Tìm kiếm lớp"></label>
        <div class="filters">
          <select id="fStatus" aria-label="Lọc theo trạng thái">
            <option value="">Tất cả trạng thái</option>
            <option value="active">Đang hoạt động</option>
            <option value="archived">Lưu trữ</option>
          </select>
          <select id="fSort" aria-label="Sắp xếp">
            <option value="name">Tên lớp (A → Z)</option>
            <option value="size">Sĩ số (cao → thấp)</option>
            <option value="recent">Hoạt động gần nhất</option>
          </select>
        </div>
        <div class="seg" role="group" aria-label="Kiểu hiển thị">
          <button type="button" id="vList" aria-pressed="true" aria-label="Dạng danh sách"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></button>
          <button type="button" id="vGrid" aria-pressed="false" aria-label="Dạng lưới"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button>
        </div>
        <button type="button" class="btn" id="btnAdd"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Thêm lớp</button>
      </div>

      <section class="stats" id="stats" aria-label="Số liệu lớp học"></section>

      <section class="card" aria-labelledby="t-list">
        <header class="card-head">
          <h2 id="t-list"><span>Các lớp đang quản lý<small>Chọn một lớp để xem danh sách học sinh và các hoạt động liên quan.</small></span></h2>
        </header>
        <div id="view"></div>
        <div class="foot"><span id="info"></span><div class="pager" id="pager"></div></div>
      </section>
    </div>

    <div class="menu" id="menu" role="menu" hidden>
      <a id="mView" role="menuitem" href="#">Xem học sinh</a>
      <button type="button" role="menuitem" data-act="edit">Chỉnh sửa</button>
      <button type="button" role="menuitem" id="mArchive" data-act="archive">Lưu trữ lớp</button>
      <button type="button" role="menuitem" class="danger" data-act="delete">Xóa lớp</button>
    </div>

    <dialog id="dlg" aria-labelledby="dlgTitle">
      <form id="form" class="dlg-body" novalidate>
        <h3 id="dlgTitle">Thêm lớp</h3>
        <div class="cols">
          <label class="fld">Tên lớp *<input name="cname" maxlength="12" placeholder="VD: 10A1" autocomplete="off"><span class="err" data-err="cname" aria-live="polite"></span></label>
          <label class="fld">Khối<select name="grade"><option value="10">Khối 10</option><option value="11">Khối 11</option><option value="12">Khối 12</option></select></label>
        </div>
        <div class="cols">
          <label class="fld">Môn học *<input name="subject" autocomplete="off"><span class="err" data-err="subject" aria-live="polite"></span></label>
          <label class="fld">Phòng học<input name="room" placeholder="VD: P.201" autocomplete="off"></label>
        </div>
        <label class="fld">Mô tả<textarea name="desc" rows="3"></textarea></label>
        <div class="dlg-actions">
          <button type="button" class="btn ghost" id="cancel">Hủy</button>
          <button type="submit" class="btn">Lưu</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <!-- ================= FOOTER ================= -->
  <div id="footer-slot"></div>

</div>

<script>
  window.PAGE = {"title": "Danh sách lớp", "breadcrumb": ["Lớp học", "Danh sách lớp"], "description": "Quản lý các lớp học bạn đang giảng dạy.", "action": "#btnAdd"};
</script>
<script src="../../assets/data-loader.js"></script>
<script src="../connect.js"></script>
<script src="classes.js"></script>
</body>
</html>
