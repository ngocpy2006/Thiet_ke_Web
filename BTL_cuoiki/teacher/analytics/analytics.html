<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learnova - Phân tích học tập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../style.css">
  
  <link rel="stylesheet" href="../../partial/sidebar/sidebar.css">
  <link rel="stylesheet" href="../../partial/topbar/topbar.css">
  <link rel="stylesheet" href="../../partial/footer/footer.css">
  
  <link rel="stylesheet" href="analytics.css">
</head>
<body>

  <div id="sidebar-slot"></div>
  <div class="main">

    <div id="topbar-slot"></div>
    <main class="content">
      <div class="page-shell">

        <div class="page-heading">
          <div>
            <h2>Phân tích học tập</h2>
            <p>Phân tích tổng hợp kết quả học tập qua nhiều bài tập và bài kiểm tra.</p>
          </div>
        </div>

        <section class="card analytics-filter-card">
          <h3>Bộ lọc phân tích</h3>
          <div class="analytics-filters">
            <div class="field"><label for="filter-class">Lớp</label><select id="filter-class" class="select"><option value="">Đang nạp dữ liệu...</option></select></div>
            <div class="field"><label for="filter-student">Học sinh</label><select id="filter-student" class="select"><option value="">Đang nạp dữ liệu...</option></select></div>
            <div class="field"><label for="filter-time">Thời gian</label><select id="filter-time" class="select"><option>30 ngày gần nhất</option><option>7 ngày gần nhất</option><option>Tháng này</option><option>Học kỳ I</option><option>Tùy chọn...</option></select></div>
            <div class="field"><label for="filter-test">Bài kiểm tra</label><select id="filter-test" class="select"><option value="">Đang nạp dữ liệu...</option></select></div>
          </div>
          <div class="analytics-actions"><button type="reset" class="btn btn-secondary">Đặt lại</button><button type="button" class="btn btn-primary"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 16 4-4 3 3 5-6"/></svg>Áp dụng</button></div>
        </section>

        <section class="card analysis-placeholder" aria-label="Khu vực kết quả phân tích">
          <div>
            <span class="placeholder-icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-4 3 3 5-6"/></svg></span>
            <h3>Khu vực hiển thị kết quả phân tích</h3>
            <p>Chọn các điều kiện ở bộ lọc phía trên và nhấn “Áp dụng”. Phần biểu đồ, chỉ số và insight có thể được bổ sung ở bước tiếp theo.</p>
          </div>
        </section>
      </div>
    </main>

    <div id="footer-slot"></div>
  </div>
<script>
  window.PAGE = {"title": "Phân tích học tập", "breadcrumb": ["Kết quả", "Phân tích học tập"]};
</script>
<script src="../../assets/data-loader.js"></script>
<script src="../connect.js"></script>
<script src="../data-fields.js"></script>
</body>
</html>
